[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rfm-structure"
version = "0.1.0"
description = "Measuring structural dependence in relational foundation models"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
rt = [
  "relational-transformer",
  "relbench==3.0.1",
  "torch>=2.13,<2.14",
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
relational-transformer = { path = "vendor/relational-transformer", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/rfm_structure"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["vendor"]
